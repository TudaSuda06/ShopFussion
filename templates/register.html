{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card border-0 shadow-sm">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-warning mb-3"></i>
                        <h3 class="fw-bold">Регистрация</h3>
                        <p class="text-muted">Создайте аккаунт в ShopFussion</p>
                    </div>
                    <form method="POST" action="">
                        <div class="mb-3">
                            <label class="form-label fw-medium"><i class="fas fa-user me-2"></i>Имя пользователя</label>
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="Придумайте имя" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium"><i class="fas fa-envelope me-2"></i>Электронная почта</label>
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="Введите почту" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium"><i class="fas fa-lock me-2"></i>Пароль</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="Придумайте пароль" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium"><i class="fas fa-user-tag me-2"></i>Зарегистрироваться как</label>
                            <select name="role" class="form-select form-select-lg">
                                <option value="buyer">Покупатель</option>
                                <option value="seller">Продавец</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold mb-3">
                            <i class="fas fa-user-plus me-2"></i>Создать аккаунт
                        </button>
                        <p class="text-center text-muted mb-0">
                            Уже есть аккаунт? <a href="{{ url_for('login') }}" class="text-warning fw-bold">Войти</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
