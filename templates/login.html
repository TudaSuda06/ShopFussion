{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card border-0 shadow-sm">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-store-alt fa-3x text-warning mb-3"></i>
                        <h3 class="fw-bold">С возвращением!</h3>
                        <p class="text-muted">Войдите в свой аккаунт ShopFussion</p>
                    </div>
                    <form method="POST" action="">
                        <div class="mb-3">
                            <label class="form-label fw-medium"><i class="fas fa-user me-2"></i>Имя пользователя</label>
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="Введите имя" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium"><i class="fas fa-lock me-2"></i>Пароль</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Войти
                        </button>
                        <p class="text-center text-muted mb-0">
                            Нет аккаунта? <a href="{{ url_for('register') }}" class="text-warning fw-bold">Зарегистрироваться</a>
                        </p>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <small class="text-muted">
                    <strong>Тестовые аккаунты:</strong><br>
                    Админ: admin / admin123 | Продавец: seller / seller123 | Покупатель: buyer / buyer123
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
