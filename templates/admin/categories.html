{% extends "base.html" %}
{% block title %}Категории{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4"><i class="fas fa-plus-circle text-warning me-2"></i>Добавить категорию</h5>
                    <form method="POST" action="">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Название категории</label>
                            <input type="text" name="name" class="form-control form-control-lg" placeholder="Введите название" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold"><i class="fas fa-plus me-2"></i>Добавить</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <h2 class="fw-bold mb-4"><i class="fas fa-tags text-warning me-2"></i> Категории</h2>
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Название</th>
                                    <th>Товаров</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for cat in categories %}
                                <tr>
                                    <td class="fw-bold"><a href="{{ url_for('products', category=cat.id) }}" class="text-decoration-none text-dark">{{ cat.name }}</a></td>
                                    <td><span class="badge bg-secondary">{{ cat_products.get(cat.id, 0) }}</span></td>
                                    <td>
                                        <form action="{{ url_for('delete_category', cat_id=cat.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Удалить категорию? Товары в этой категории останутся без категории.')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
